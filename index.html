<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnitFlow Pro | Convert & Calculate</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #6c5ce7;
            --bg: #f8f9fa;
            --card: #ffffff;
            --text: #2d3436;
            --accent: #f1f2f6;
            --success: #00b894;
            --secondary: #a29bfe;
            --github: #24292e;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        .main-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .main-header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-header p {
            margin: 5px 0 0 0;
            font-size: 0.8rem;
            color: #b2bec3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }

        h2 {
            margin: 0 0 15px 0;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--secondary);
            font-weight: 800;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Inputs */
        .unit-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 700;
            margin-bottom: 4px;
            font-size: 0.75rem;
        }

        .unit-input,
        .calc-input {
            padding: 12px;
            border: 2px solid var(--accent);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
            background: var(--accent);
            font-family: 'SF Mono', monospace;
        }

        .unit-input:focus,
        .calc-input:focus {
            border-color: var(--primary);
            background: #fff;
        }

        /* History Sections */
        .history-box {
            margin-top: 15px;
            border-top: 2px solid var(--accent);
            padding-top: 10px;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 100px;
            overflow-y: auto;
            font-size: 0.8rem;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #f1f2f6;
        }

        .history-val {
            color: var(--primary);
            font-weight: 700;
            cursor: pointer;
            background: var(--accent);
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* Buttons */
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
        }

        .btn-export {
            background: var(--success);
            color: white;
        }

        .btn-clear {
            background: #ffeaa7;
            color: #d63031;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Footer */
        .footer {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding-bottom: 30px;
        }

        #qrcode {
            background: white;
            padding: 8px;
            border-radius: 8px;
        }

        .github-link {
            text-decoration: none;
            color: var(--github);
            font-weight: 700;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>

<body>

    <div class="main-header">
        <h1>UnitFlow</h1>
        <p>Measurement & Logic Hub</p>
    </div>

    <div class="container">
        <div class="card">
            <h2>Measurements <span>History</span></h2>
            <div class="unit-group">
                <div class="input-wrapper">
                    <label>Millimeters (mm)</label>
                    <input type="number" id="mm" class="unit-input" placeholder="0" step="any">
                </div>
                <div class="input-wrapper">
                    <label>Centimeters (cm)</label>
                    <input type="number" id="cm" class="unit-input" placeholder="0" step="any">
                </div>
                <div class="input-wrapper">
                    <label>Feet (ft)</label>
                    <input type="number" id="ft" class="unit-input" placeholder="0" step="any">
                </div>
            </div>
            <div class="history-box">
                <div class="history-list" id="unitHistory"></div>
            </div>
        </div>

        <div class="card">
            <h2>Quick Calculator <span>Live Eval</span></h2>
            <input type="text" id="calcInput" class="calc-input" placeholder="e.g. 10 + 5 * 2" inputmode="decimal"
                spellcheck="false">
            <div style="display:flex; justify-content: space-between; padding: 10px 5px; align-items: center;">
                <span style="font-size: 0.7rem; font-weight: 800; color: #b2bec3;">RESULT</span>
                <span id="calcResult"
                    style="font-weight: 700; color: var(--success); font-family: monospace; font-size: 1.2rem;">0</span>
            </div>

            <div class="history-box">
                <div id="calcHistory" class="history-list"></div>
            </div>

            <div class="btn-row">
                <button class="btn-export" onclick="exportData()">Export CSV</button>
                <button class="btn-clear" onclick="clearAllHistory()">Clear All</button>
            </div>
        </div>

        <div class="footer">
            <div id="qrcode"></div>
            <a href="https://github.com/yourusername/your-repo" target="_blank" class="github-link">Source Code</a>
        </div>
    </div>

    <script>
        const mmInput = document.getElementById('mm');
        const cmInput = document.getElementById('cm');
        const ftInput = document.getElementById('ft');
        const calcInput = document.getElementById('calcInput');
        const calcResult = document.getElementById('calcResult');
        const unitHistory = document.getElementById('unitHistory');
        const calcHistory = document.getElementById('calcHistory');

        let historyStore = { units: [], calcs: [] };

        /* --- Unit Logic --- */
        function updateUnits(source) {
            let val = parseFloat(source.value);
            if (isNaN(val)) return;

            let results = {};
            if (source === mmInput) {
                results = { mm: val, cm: (val / 10).toFixed(2), ft: (val / 304.8).toFixed(3) };
                cmInput.value = results.cm; ftInput.value = results.ft;
            } else if (source === cmInput) {
                results = { mm: (val * 10).toFixed(2), cm: val, ft: (val / 30.48).toFixed(3) };
                mmInput.value = results.mm; ftInput.value = results.ft;
            } else if (source === ftInput) {
                results = { mm: (val * 304.8).toFixed(2), cm: (val * 30.48).toFixed(2), ft: val };
                mmInput.value = results.mm; cmInput.value = results.cm;
            }

            // Auto-save history after 1.5s of no typing
            clearTimeout(window.unitTimeout);
            window.unitTimeout = setTimeout(() => {
                const entry = `${results.mm}mm | ${results.cm}cm | ${results.ft}ft`;
                if (historyStore.units[0] !== entry) {
                    historyStore.units.unshift(entry);
                    renderHistory(unitHistory, historyStore.units);
                }
            }, 1500);
        }

        [mmInput, cmInput, ftInput].forEach(i => i.addEventListener('input', () => updateUnits(i)));

        /* --- Calculator Logic (FIXED) --- */
        function safeEval(str) {
            try {
                // Clean the string: only allow numbers, math operators, dots, and parentheses
                const sanitized = str.replace(/[^-()\d/*+.]/g, '');
                if (!sanitized) return null;
                const res = new Function('return ' + sanitized)();
                return (res !== undefined && !isNaN(res)) ? res : null;
            } catch { return null; }
        }

        calcInput.addEventListener('input', () => {
            const res = safeEval(calcInput.value);
            if (res !== null) {
                calcResult.textContent = Number.isInteger(res) ? res : res.toFixed(4);
                calcResult.style.color = "var(--success)";
            } else {
                calcResult.style.color = "#fab1a0";
            }
        });

        calcInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const res = calcResult.textContent;
                const exp = calcInput.value.trim();
                if (exp && res !== "0") {
                    historyStore.calcs.unshift(`${exp} = ${res}`);
                    renderHistory(calcHistory, historyStore.calcs, true);
                    calcInput.value = '';
                    calcResult.textContent = '0';
                }
            } else if (e.key === 'Escape') {
                calcInput.value = '';
                calcResult.textContent = '0';
            }
        });

        /* --- History Display --- */
        function renderHistory(element, data, isCalc = false) {
            element.innerHTML = data.slice(0, 5).map(item => `
            <div class="history-item">
                <span style="color: #636e72">${item}</span>
                <span class="history-val" onclick="useHistoryVal('${item}', ${isCalc})">Use</span>
            </div>
        `).join('');
        }

        function useHistoryVal(val, isCalc) {
            if (isCalc) {
                // Extract the result part after the '='
                const resultPart = val.split('=')[1].trim();
                calcInput.value = resultPart;
                calcResult.textContent = resultPart;
            } else {
                const mmPart = val.split('|')[0].replace('mm', '').trim();
                mmInput.value = mmPart;
                updateUnits(mmInput);
            }
        }

        /* --- Export & Clear --- */
        function exportData() {
            let csvContent = "data:text/csv;charset=utf-8,Type,Record\n";
            historyStore.units.forEach(u => csvContent += `Unit,"${u}"\n`);
            historyStore.calcs.forEach(c => csvContent += `Calc,"${c}"\n`);
            const link = document.createElement("a");
            link.href = encodeURI(csvContent);
            link.download = "unitflow_records.csv";
            link.click();
        }

        function clearAllHistory() {
            historyStore = { units: [], calcs: [] };
            unitHistory.innerHTML = '';
            calcHistory.innerHTML = '';
            calcResult.textContent = '0';
        }

        /* --- QR Code --- */
        new QRCode(document.getElementById("qrcode"), {
            text: window.location.href,
            width: 80, height: 80
        });
    </script>
</body>

</html>
