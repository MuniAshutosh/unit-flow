<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision Unit Converter & Calculator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #6c5ce7;
            --bg: #f8f9fa;
            --card: #ffffff;
            --text: #2d3436;
            --accent: #f1f2f6;
            --success: #00b894;
            --secondary: #a29bfe;
            --github: #24292e;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        /* --- Main Page Title --- */
        .main-header {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 10px;
        }

        .main-header h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .main-header p {
            margin: 5px 0 0 0;
            font-size: 0.85rem;
            color: #b2bec3;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .card {
            background: var(--card);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        }

        h2 { 
            margin: 0 0 18px 0; 
            font-size: 0.85rem; 
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--secondary);
            font-weight: 800;
        }

        /* --- Unit Converter --- */
        .unit-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-wrapper { display: flex; flex-direction: column; }
        label { font-weight: 700; margin-bottom: 6px; font-size: 0.8rem; }

        .unit-input {
            padding: 12px 16px;
            border: 2px solid var(--accent);
            border-radius: 12px;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.2s ease;
            background: var(--accent);
            font-weight: 500;
        }

        .unit-input:focus { border-color: var(--primary); background: #fff; }

        /* --- Calculator --- */
        #calcInput {
            width: 100%;
            border: 2px solid var(--accent);
            background: var(--accent);
            padding: 14px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-family: 'SF Mono', monospace;
            box-sizing: border-box;
            outline: none;
        }

        #calcInput:focus { border-color: var(--primary); background: #fff; }

        .result-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 0 5px;
        }

        #calcResult {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--success);
            font-family: 'SF Mono', monospace;
        }

        /* --- History --- */
        .history-container {
            margin-top: 20px;
            border-top: 2px solid var(--accent);
            padding-top: 15px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .clear-btn {
            font-size: 0.7rem;
            color: #ff7675;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            border: none;
            background: none;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 120px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--accent);
            font-family: 'SF Mono', monospace;
        }

        .history-val { font-weight: 700; color: var(--primary); cursor: pointer; }

        /* --- Sharing & Footer --- */
        .footer {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding-bottom: 40px;
        }

        #qrcode {
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .github-link {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--github);
            font-weight: 700;
            font-size: 0.9rem;
            background: #fff;
            padding: 8px 16px;
            border-radius: 50px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .github-link:hover { transform: translateY(-2px); }
        .hint { font-size: 0.7rem; color: #b2bec3; text-align: center; margin-top: 5px; }

    </style>
</head>
<body>

<div class="main-header">
    <h1>UnitFlow</h1>
    <p>Convert & Calculate Effortlessly</p>
</div>

<div class="container">
    <div class="card">
        <h2>Measurements</h2>
        <div class="unit-group">
            <div class="input-wrapper">
                <label>Millimeters (mm)</label>
                <input type="number" id="mm" class="unit-input" placeholder="0">
            </div>
            <div class="input-wrapper">
                <label>Centimeters (cm)</label>
                <input type="number" id="cm" class="unit-input" placeholder="0">
            </div>
            <div class="input-wrapper">
                <label>Feet (ft)</label>
                <input type="number" id="ft" class="unit-input" placeholder="0">
            </div>
        </div>
    </div>

    <div class="card">
        <h2>Quick Calculator</h2>
        <input type="number" id="calcInput" placeholder="Type math and press Enter..." spellcheck="false">
        <div class="result-area">
            <span style="font-size: 0.7rem; font-weight: 800; color: #b2bec3;">RESULT</span>
            <span id="calcResult">0</span>
        </div>
        
        <div class="history-container">
            <div class="history-header">
                <h2>History</h2>
                <button class="clear-btn" onclick="clearHistory()">Clear</button>
            </div>
            <ul id="historyList" class="history-list"></ul>
        </div>
    </div>

    <div class="footer">
        <div id="qrcode"></div>
        <p class="hint">Scan to share tool</p>
        
        <a href="https://github.com/yourusername/your-repo" target="_blank" class="github-link">
            <svg height="20" width="20" viewBox="0 0 16 16"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
            Source Code
        </a>
    </div>
</div>

<script>
    /* --- Unit Converter --- */
    const mmInput = document.getElementById('mm');
    const cmInput = document.getElementById('cm');
    const ftInput = document.getElementById('ft');

    function updateUnits(source) {
        let val = parseFloat(source.value);
        if (isNaN(val)) {
            if (source.value === "") mmInput.value = cmInput.value = ftInput.value = '';
            return;
        }
        if (source === mmInput) {
            cmInput.value = parseFloat((val / 10).toFixed(4));
            ftInput.value = parseFloat((val / 304.8).toFixed(4));
        } else if (source === cmInput) {
            mmInput.value = parseFloat((val * 10).toFixed(4));
            ftInput.value = parseFloat((val / 30.48).toFixed(4));
        } else if (source === ftInput) {
            mmInput.value = parseFloat((val * 304.8).toFixed(4));
            cmInput.value = parseFloat((val * 30.48).toFixed(4));
        }
    }

    [mmInput, cmInput, ftInput].forEach(input => {
        input.addEventListener('input', () => updateUnits(input));
    });

    /* --- Calculator & History --- */
    const calcInput = document.getElementById('calcInput');
    const calcResult = document.getElementById('calcResult');
    const historyList = document.getElementById('historyList');

    function safeEval(str) {
        try {
            const sanitized = str.replace(/[^-()\d/*+.]/g, '');
            if (!sanitized) return null;
            const result = new Function('return ' + sanitized)();
            return (result !== undefined && !isNaN(result)) ? result : null;
        } catch { return null; }
    }

    calcInput.addEventListener('input', () => {
        const res = safeEval(calcInput.value);
        if (res !== null) {
            calcResult.textContent = Number.isInteger(res) ? res : res.toFixed(4);
            calcResult.style.color = "var(--success)";
        } else {
            calcResult.style.color = "#fab1a0";
        }
    });

    calcInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const expression = calcInput.value.trim();
            const result = calcResult.textContent;
            if (expression && result !== "0") {
                const li = document.createElement('li');
                li.className = 'history-item';
                li.innerHTML = `<span style="color:#636e72">${expression} =</span> <span class="history-val" onclick="useVal('${result}')">${result}</span>`;
                historyList.prepend(li);
                calcInput.value = "";
                calcResult.textContent = "0";
            }
        } else if (e.key === 'Escape') {
            calcInput.value = ""; calcResult.textContent = "0";
        }
    });

    function useVal(v) { calcInput.value = v; calcResult.textContent = v; calcInput.focus(); }
    function clearHistory() { historyList.innerHTML = ''; }

    /* --- Generate QR Code --- */
    new QRCode(document.getElementById("qrcode"), {
        text: window.location.href,
        width: 100,
        height: 100,
        colorDark : "#2d3436",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
    });
</script>

</body>
</html>
